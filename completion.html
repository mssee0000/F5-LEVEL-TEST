<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神圣遗迹：通关大捷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+SC:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans SC', 'Times New Roman', serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #03070d, #0d131a);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .summary-card {
            width: 90%;
            background: linear-gradient(135deg, #161f2b, #0d131a);
            border: 2px solid #8b6508;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2), inset 0 0 25px rgba(0, 0, 0, 0.9);
            text-align: center;
            color: #f0f0f0;
        }

        .victory-badge {
            font-size: 50px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
            animation: bounce 2s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .level-title {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
            letter-spacing: 2px;
        }

        .teacher-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px dashed #d4af37;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 35px;
            text-align: left;
            line-height: 1.7;
            color: #f4e8c1;
        }

        .teacher-title {
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
        }

        .teacher-msg {
            font-size: 14.5px;
            white-space: pre-line;
            text-align: justify;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(to bottom, #d4af37, #8b6508);
            border: 2px solid #ffdf70;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            transition: transform 0.2s;
            text-decoration: none;
            text-align: center;
        }

        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="summary-card">
        <div class="victory-badge">👑</div>
        <h2 class="level-title">古殿迷宫 终极大捷</h2>

        <div class="teacher-box">
            <div class="teacher-title">👨‍🏫 Jack老师</div>
            <p class="teacher-msg" id="teacher-msg">恭喜你完成所有学习任务！

你的历史学习报告已经准备好了。

接下来请填写资料，
领取你的专属学习分析报告。</p>
        </div>

        <button class="action-btn" onclick="proceed()">生成我的学习报告</button>
    </div>
</div>

<script>
    function proceed() {
        window.location.href = "student_info.html";
    }
</script>
</body>
</html>
